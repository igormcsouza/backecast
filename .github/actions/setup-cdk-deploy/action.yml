name: Set up CDK deploy tooling and AWS credentials
description: >-
  Shared setup steps for every job that runs `cdk deploy`/`cdk destroy`
  against real AWS (deploy.yml's deploy-backend) or read-only against it
  (ci.yml's deploy-check, which only runs `cdk diff`). Extracted after code
  review flagged jobs duplicating this block verbatim — a future tooling
  change (CDK version, Node version, install method) now only needs
  editing once. Does NOT include `actions/checkout`: callers check out
  different refs (the CI commit, a release tag), so that step stays in
  each workflow rather than being hidden behind an input here.

  Auth: a static IAM user access key (`backecast-github-actions`, member of
  the same `Projects` IAM group used by Igor's other repos), passed as repo
  secrets — matching the pattern the rest of Igor's projects use. This repo
  previously used GitHub OIDC federation (no long-lived keys); switched back
  to a static key pair for consistency with the other projects' CI setup.

inputs:
  aws-access-key-id:
    description: IAM user access key ID (repo secret).
    required: true
  aws-secret-access-key:
    description: IAM user secret access key (repo secret).
    required: true
  aws-region:
    description: AWS region to deploy into.
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: infra/uv.lock
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm i -g aws-cdk
      shell: bash

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
