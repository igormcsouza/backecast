# Continuous deployment to `prod` — the one, always-on public environment.
# Every push to `main` (i.e. every merge) deploys whatever actually
# changed, automatically. There is no separate `dev` stage anymore: it
# used to be a permanent always-on environment sitting alongside `prod`,
# duplicating its cost, while `deploy-preview.yml`'s ephemeral `pr-<number>`
# stacks already cover pre-merge testing. `main` merging straight to `prod`
# means PR review + the PR preview stack *are* the pre-production gate —
# there's no second "deploy to dev, poke it, then promote" step anymore.
#
# A few ideas worth reading before touching this file:
#
# 1. Auth is a static IAM user access key (`backecast-github-actions`,
#    repo secrets `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY`), the same
#    pattern Igor's other projects use — see
#    `.github/actions/setup-cdk-deploy/action.yml`. (This repo briefly used
#    GitHub OIDC federation instead; switched back for consistency across
#    projects.)
#
# 2. deploy-frontend is the deliberate contrast case within AWS-vs-not: it
#    needs *no* AWS credentials for the actual publish step — GitHub Pages
#    isn't AWS, so `actions/deploy-pages` talks to GitHub's own Pages API
#    using GitHub's own separate OIDC token (that's what deploy-frontend's
#    `id-token: write` is for — a GitHub<->GitHub exchange, unrelated to
#    AWS auth). It does still need read-only AWS access to fetch the
#    already-deployed API URL when only frontend files changed (see the
#    `changes` job below) — that one AWS call is the only AWS-shaped thing
#    in that job.
#
# 3. Path-based gating (the `changes` job below): a push that only touches
#    `frontend/` shouldn't trigger a backend CDK deploy, a push that only
#    touches `backend/`/`infra/` shouldn't trigger a frontend rebuild+
#    publish, and a docs-only push (README.md, CLAUDE.md) should deploy
#    nothing at all. `dorny/paths-filter` diffs the single commit CI just
#    validated (`base: HEAD^`, from a 2-commit-deep checkout) against its
#    parent — cheap and accurate for this repo's one-commit-per-merge
#    history on `main`. The known gap: if CD didn't run (or skipped) on an
#    earlier commit that *did* touch a layer, and the next commit that
#    triggers CD doesn't touch that same layer, the diff won't "remember"
#    the earlier undeployed change — this only ever looks one commit back,
#    not since the last successful deploy. `workflow_dispatch` (below)
#    exists as the manual recovery for exactly that case: it skips the
#    `changes` gate entirely and deploys both layers unconditionally.
name: CD

# Runs after CI finishes on `main` (the normal path), not on every push
# directly — a plain `push: branches: [main]` trigger on *this* workflow
# would let cdk deploy start racing CI's own test run, deploying code CI
# hasn't finished checking yet. `workflow_run` instead watches the CI
# workflow (ci.yml) and only fires once it *completes* on `main`; the `if`
# gate below then checks it completed with conclusion "success" (CI's own
# path-filtered jobs skipping is fine — GitHub reports a workflow's overall
# conclusion as "success" as long as nothing in it actually failed).
#
# `workflow_dispatch` is the manual escape hatch — see header comment (3)
# — for re-running a deploy that a path-filter gap left undone, without a
# throwaway commit. Unlike the `workflow_run` path, it deploys both layers
# unconditionally (no `changes` gate at all).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: parent
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'infra/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    needs: changes
    # always() so a workflow_dispatch run (where `changes` is skipped
    # entirely, see its `if:` above) still deploys — `needs.changes.result
    # == 'skipped'` covers that; the workflow_run path still gates on the
    # actual path-filter output.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      # No required-reviewers rule on this yet (a repo Settings ->
      # Environments change, not a CDK/workflow one) — named here so
      # turning that on later is zero-code.
      name: production
    defaults:
      run:
        working-directory: infra
    steps:
      # Deploy the exact commit CI just passed (workflow_run), or whatever
      # `main` currently is (workflow_dispatch — there's no
      # `workflow_run` context to pin to).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-cdk-deploy
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION || 'sa-east-1' }}

      # --require-approval never: `cdk deploy` normally pauses for an
      # interactive y/n before applying any change that broadens IAM
      # permissions or security group rules. There is no human at a
      # terminal in CI to answer that prompt — left at its default, this
      # step would simply hang until the job times out. Passing this flag
      # is what makes an unattended deploy possible at all; it does not
      # weaken what the IAM user above is allowed to do, only skips asking
      # a human who was never going to be there to answer.
      - run: >
          uv run cdk deploy
          "Backecast-prod-Data" "Backecast-prod-Auth" "Backecast-prod-Api" "Backecast-prod-Pipeline"
          --require-approval never

  # See header comment (2). Reads the API URL directly from the Api
  # stack's own CfnOutput rather than depending on deploy-backend's
  # output — deploy-backend may not have run this time (frontend-only
  # push), so this job resolves the URL for whatever is currently live.
  deploy-frontend:
    needs: [changes, deploy-backend]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # GitHub's own Pages OIDC token — not AWS's, see header comment (2)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION || 'sa-east-1' }}

      - name: Read the currently-deployed API URL from the Api stack's CfnOutput
        id: api_url
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name Backecast-prod-Api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "value=$URL" >> "$GITHUB_OUTPUT"

      - name: Read the Cognito User Pool client id from the Auth stack's CfnOutput
        id: cognito
        run: |
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name Backecast-prod-Auth \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # NEXT_PUBLIC_API_URL is read by lib/api.ts at build time and inlined
      # into the static export's client bundle (see frontend/.env.example).
      # NEXT_BASE_PATH=/backecast is Phase 6's existing GitHub Pages
      # subpath convention (see frontend/next.config.ts's docstring) —
      # this is the one place that actually sets it for a real deploy;
      # local dev and the e2e Docker build both leave it unset.
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.api_url.outputs.value }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_DEPLOY_REGION || 'sa-east-1' }}
          NEXT_BASE_PATH: /backecast

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - id: deployment
        uses: actions/deploy-pages@v4
