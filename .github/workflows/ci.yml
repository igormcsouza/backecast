name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.e2e.yml'
              - 'scripts/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv run ruff check .
      # Unit tests only — tests/integration/ needs the docker-compose/
      # LocalStack network (real hostnames like `api`/`localstack`, ffmpeg,
      # etc.) and is never runnable bare like this; it runs inside the e2e
      # job below instead, against the actual compose stack.
      - run: uv run pytest tests --ignore=tests/integration

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: infra/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g aws-cdk
      - run: uv run ruff check .
      - run: uv run cdk synth
      - run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Phase 7: browser-level safety net. Boots the *whole* stack (LocalStack +
  # api + worker + a static-served frontend build) via docker compose, then
  # runs the Playwright suite against it — as a container on the same
  # compose network, for the same reason e2e/conftest.py explains: presigned
  # S3 URLs the backend hands back only resolve inside that network's
  # internal DNS, so both the frontend under test and the browser driving it
  # have to live on it, not on the runner's bare host.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the compose stack (LocalStack, api, worker, frontend)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --build localstack init api worker frontend

      - name: Wait for the API and frontend to answer on their host ports
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8989/api/v1/health >/dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3300/ >/dev/null; do sleep 2; done'

      # Runs inside the `api` container, on the compose network — the only
      # place these tests are runnable at all (real LocalStack hostnames,
      # ffmpeg, AUTH_STUB=1 for the admin-auth checks). See CLAUDE.md's
      # testing-strategy section.
      - name: Run backend integration tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            run --rm api uv run pytest tests/integration

      - name: Run the E2E suite
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            run --rm e2e

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
