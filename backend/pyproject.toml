[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-openai>=1.6.0",
    "mangum>=0.21.0",
    "openai>=3.3.1",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-branch --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]
