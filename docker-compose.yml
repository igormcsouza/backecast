services:
  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=s3,sqs,dynamodb,ssm
      - DEBUG=0
    volumes:
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    image: localstack/localstack:3
    entrypoint: ["/bin/bash"]
    command: ["/init-localstack.sh"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./scripts/init-localstack.sh:/init-localstack.sh:ro
    depends_on:
      localstack:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8989:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - STAGE=dev
      - TABLE_NAME=backecast-dev
      - AWS_REGION=sa-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - MEDIA_BUCKET_NAME=backecast-media-dev
      - ADMIN_KEY_PARAM_NAME=/backecast/dev/admin-key
    depends_on:
      init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "worker.local_poller"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
    environment:
      - STAGE=dev
      - TABLE_NAME=backecast-dev
      - AWS_REGION=sa-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - WORKER_QUEUE_URL=http://localstack:4566/000000000000/backecast-dev-media-queue
      # Sabotage exercise toggles (Phase 4) — both off by default. Set to
      # "1" / a positive number, then `docker compose up -d --force-recreate
      # worker`, to reproduce the exercises documented in SESSIONS.md.
      - WORKER_SABOTAGE_FORCE_FAILURE=${WORKER_SABOTAGE_FORCE_FAILURE:-0}
      - WORKER_SABOTAGE_SLEEP_SECONDS=${WORKER_SABOTAGE_SLEEP_SECONDS:-0}
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  localstack-data:
